[package]
name = "imagespin"
version = "0.1.0"
edition = "2021"
default-run = "imagespin"

[dependencies]
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# real-time viewer (src/bin/live.rs)
bytemuck = { version = "1.14", features = ["derive"] }
env_logger = "0.11"
pollster = "1"
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng"] }
wgpu = "30"
winit = "0.30"
tiny-skia = "0.12"
ttf-parser = "0.25"
json5 = "1"
serde_path_to_error = "0.1"

[profile.release]
opt-level = 3

[dev-dependencies]
# Already built by wgpu; used to validate the assembled WGSL in tests.
naga = { version = "30", features = ["wgsl-in"] }
